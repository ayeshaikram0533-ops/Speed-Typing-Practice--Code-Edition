<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Typing Practice</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Speed Typing</h1>
            <p>Type a word and press enter to submit</p>
        </div>
        <div class="states">
            <div class="stat-box">
                <div class="label">Time</div>
                <div class="value" id="timer-display">30</div>
            </div>
        <div class="stat-box">
         <div class="label">WPM</div>   
        <div class="value" id="wpm-display">0</div>
        </div>
        <div class="stat-box">
        <div class="label">Accuracy</div>
        <div class="value" id="accuracy-display">100%</div>
        </div>
        <div class="stat-box">
            <div class="label">Score</div>
        <div class="value" id="score-display">0</div>
        </div>
    </div>

    <!-- word display -->
     <div class="word-display">
        <div class="current-word" id="current-word"
        >ready</div>
     </div>

     <!-- input -->
      <div class="input-area">
        <input type="text" id="word-input" placeholder="Type a word and press Enter..." disabled />
      </div>

      <!-- Buttons -->
       <div class="buttons">
        <div class="button-start" id="start-button">Start</div>
        <div class="button-reset" id="reset-button">Reset</div>
       </div>

        <!-- PROGRESS -->
        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text" id="progress-text">Ready to start!</div>
        </div>

        <!-- HIGH SCORE -->
        <div class="high-score">
            <span class="label"> High Score: </span>
            <span id="high-score-display">0</span>
            <span class="label"> WPM</span>
        </div>
    </div>
</body>
</html>
